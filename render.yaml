databases:
  - name: tender-db
    databaseName: tender_intelligence
    user: tender_user
    plan: free

services:
  - type: web
    name: tender-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tender-db
          property: connectionString
