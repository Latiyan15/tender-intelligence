name: Daily GeM Tender Sheet Update

on:
  schedule:
    # 8:45 AM IST = 3:15 AM UTC
    - cron: "15 3 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  sync-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GeM Sheets Sync (DC infrastructure)
        env:
          # Google Service Account credentials (JSON string stored as GitHub secret)
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          # Indian HTTP proxy for accessing gov.in portals
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python gem_sheets_sync.py --remove-expired

      - name: Run GeM Sheets Sync (Cyber security)
        # continue-on-error so a secondary cyber failure never fails the DC sync above.
        continue-on-error: true
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python gem_sheets_sync.py --domain cyber --remove-expired

      - name: Log completion
        if: always()
        run: echo "Sync completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
