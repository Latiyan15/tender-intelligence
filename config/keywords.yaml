# ──────────────────────────────────────────────────────────────────────────────
# Nikom Tender Discovery — Keyword Configuration
# Structured into 4 primary domains based on empirical Nikom contracts:
# Tier A: Cyber Security (Firewalls, NGFW, UTM, SOC, SIEM, VAPT)
# Tier B: IT Infrastructure (Compute, Storage, Switching, Racks, iPDU, Cabling)
# Tier C: Cloud & DR (Public/GovCloud, DR Sites, Virtualization, Backup)
# Tier D: Non-IT Infrastructure & Services (Turnkey DC, Modular UPS, PAC, Novec, CAMC, FMS)
# ──────────────────────────────────────────────────────────────────────────────

inclusion_rules:
  tier_a_min_matches: 1
  tier_b_min_matches: 1
  tier_c_min_matches: 1
  tier_d_min_matches: 1
  tier_c_requires_dc_context: false
  tier_d_separate_category: false

