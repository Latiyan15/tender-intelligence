# ─────────────────────────────────────────────────────────────────────────────
# NEGATIVE KEYWORDS — Filter or contextually reject noise
# ─────────────────────────────────────────────────────────────────────────────
negatives:
  hard_reject_terms:
    noise_reject:
      - "district collector"
      - "direct current"
      - "DC motor"
      - "DC drive"
      - "Deputy Commissioner"
      - "UPS courier"
      - "UPS for traffic signal"
      - "UPS for traffic signals"
      - "Provincial Armed Constabulary"
      - "Public Accounts Committee"
      - "data entry"
      - "data collection"
      - "census data"
      - "data digitisation"
      - "data digitization"
      - "catering staff"
      - "warehouse rack"
      - "storage rack"
      - "pallet rack"

  soft_reject_terms:
    hardware_only:
      description: "Generic office supply without IT or infrastructure scope."
      terms:
        - "supply of stationery"
        - "printing and stationery"
        - "cleaning services"
        - "housekeeping services"
      override_if_also_contains:
        - "server"
        - "firewall"
        - "UPS"
        - "cloud"
        - "AMC"

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURABLE THRESHOLDS
# ─────────────────────────────────────────────────────────────────────────────
thresholds:
  min_value_inr: 0
  min_ups_kva: 10
  max_days_to_deadline: 0
