# ──────────────────────────────────────────────────────────────────────────────
# Nikom Tender Discovery — Keyword Configuration
# Structured into 4 primary domains:
# Tier A: Cyber Security
# Tier B: IT Infrastructure
# Tier C: Cloud
# Tier D: Non-IT Infrastructure & Services
# ──────────────────────────────────────────────────────────────────────────────

inclusion_rules:
  tier_a_min_matches: 1
  tier_b_min_matches: 1
  tier_c_min_matches: 1
  tier_d_min_matches: 1
  tier_c_requires_dc_context: false
  tier_d_separate_category: false

# ─────────────────────────────────────────────────────────────────────────────
# TIER A — Cyber Security (Critical Threat Protection, Compliance & Monitoring)
# ─────────────────────────────────────────────────────────────────────────────
tier_a:
  label: "Cyber Security"
  groups:
    soc_and_siem:
      - "SOC"
      - "SIEM"
      - "security operations centre"
      - "security operations center"
      - "SOAR"
      - "XDR"
      - "MDR"
      - "managed detection and response"
      - "security monitoring"
      - "incident response"

    firewalls_and_network_security:
      - "next generation firewall"
      - "next-generation firewall"
      - "NGFW"
      - "firewall"
      - "firewalls"
      - "UTM"
      - "unified threat management"
      - "WAF"
      - "web application firewall"
      - "DDoS protection"
      - "intrusion prevention system"
      - "IPS"
      - "intrusion detection system"
      - "IDS"
      - "network security"
      - "VPN gateway"
      - "secure web gateway"
      - "SWG"

    endpoint_and_threat_defense:
      - "endpoint detection and response"
      - "EDR"
      - "endpoint security"
      - "antivirus"
      - "anti-virus"
      - "anti-malware"
      - "anti-ransomware"
      - "threat intelligence"
      - "zero day protection"
      - "zero-day protection"
      - "vulnerability management"
      - "patch management"

    identity_and_access:
      - "IAM"
      - "identity and access management"
      - "PAM"
      - "privileged access management"
      - "identity management"
      - "multi factor authentication"
      - "multi-factor authentication"
      - "MFA"
      - "2FA"
      - "SSO"
      - "single sign on"
      - "zero trust"
      - "zero trust network access"
      - "ZTNA"

    data_security_and_compliance:
      - "DLP"
      - "data loss prevention"
      - "data leakage prevention"
      - "encryption"
      - "HSM"
      - "hardware security module"
      - "vulnerability assessment"
      - "penetration testing"
      - "VAPT"
      - "cyber security audit"
      - "cybersecurity audit"
      - "CERT-In"
      - "CERT-In empanelled"
      - "ISO 27001"
      - "information security"
      - "cyber security"
      - "cybersecurity"
      - "cyber-security"
      - "cyber audit"

  contextual_terms:
    - term: "SOC"
      group: "soc_and_siem"
      require_context:
        - "security"
        - "cyber"
        - "incident"
        - "threat"
        - "monitor"
        - "siem"
        - "network"
      reject_context:
        - "society"
        - "soccer"
        - "state of charge"

    - term: "WAF"
      group: "firewalls_and_network_security"
      require_context:
        - "firewall"
        - "security"
        - "web"
        - "application"
        - "traffic"
        - "http"

    - term: "UTM"
      group: "firewalls_and_network_security"
      require_context:
        - "firewall"
        - "threat"
        - "security"
        - "appliance"
        - "gateway"

    - term: "PAM"
      group: "identity_and_access"
      require_context:
        - "privileged"
        - "access"
        - "credential"
        - "security"
        - "identity"

    - term: "IAM"
      group: "identity_and_access"
      require_context:
        - "identity"
        - "access"
        - "management"
        - "security"
        - "user"

